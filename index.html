<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a16"><title>FootX – Fußballmanager</title>
<style>
:root{color-scheme:dark;--bg:#0b100e;--panel:#151e19;--panel2:#1c2921;--green:#b7f36b;--muted:#9aaba0;--line:#2c3b31;--red:#ff827e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a3023 0,#0b100e 55%);font:15px system-ui,-apple-system,sans-serif;color:#f2f6f0;padding-bottom:90px}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--green);color:#152012;font-weight:750;cursor:pointer}button:active{transform:scale(.98)}button.secondary{background:#26352b;color:#f1f6ef;border:1px solid #35483a}header{padding:calc(18px + env(safe-area-inset-top)) 18px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d1511ed;backdrop-filter:blur(14px);z-index:5}.brand{font-weight:900;font-size:22px;letter-spacing:-.7px}.brand span{color:var(--green)}.sub{font-size:12px;color:var(--muted);margin-top:2px}.wrap{max-width:760px;margin:auto;padding:18px 14px}.hero{background:linear-gradient(135deg,#243e2a,#15231a);border:1px solid #39513b;border-radius:22px;padding:20px;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--green);font-weight:800;text-transform:uppercase}.hero h1{font-size:29px;line-height:1.1;margin:8px 0}.hero p{color:#c2d0c4;margin:0 0 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat small,.muted{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:19px;margin-top:4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}.sectionhead h2{font-size:18px;margin:0}.rows{display:grid;gap:9px}.player,.fixture,.clubrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.avatar{width:42px;height:42px;border-radius:12px;background:#2c4031;display:grid;place-items:center;font-weight:900;color:var(--green);flex-shrink:0}.grow{flex:1;min-width:0}.name{font-weight:750}.detail{font-size:12px;color:var(--muted);margin-top:3px}.rating{font-weight:900;color:var(--green)}.price{font-size:12px;color:#d5e1d7;margin-top:3px}.nav{position:fixed;bottom:0;left:0;right:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:#0e1612f5;border-top:1px solid var(--line);backdrop-filter:blur(15px);z-index:10}.nav button{background:transparent;color:var(--muted);padding:8px 2px;font-size:11px;border-radius:10px}.nav button.active{color:var(--green);background:#233427}.nav .ico{display:block;font-size:19px;margin-bottom:2px}.pill{display:inline-block;background:#263b2a;color:var(--green);font-size:11px;border-radius:99px;padding:4px 8px}.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actionrow button{flex:1}.field{width:100%;background:#0e1711;border:1px solid var(--line);color:white;padding:12px;border-radius:12px;margin:5px 0 12px}.label{font-size:12px;color:var(--muted)}.notice{color:var(--muted);font-size:12px;line-height:1.5;margin-top:14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px 5px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:11px}.table td:not(:first-child),.table th:not(:first-child){text-align:center}.table tr:first-child td{color:var(--green);font-weight:800}.score{font-size:18px;font-weight:900;white-space:nowrap}.empty{text-align:center;padding:30px;color:var(--muted)}.toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);background:var(--green);color:#172015;padding:10px 16px;border-radius:12px;font-weight:800;z-index:20;display:none;box-shadow:0 5px 30px #0008}h3{margin:0 0 8px} @media(min-width:600px){.wrap{padding:24px}.hero{padding:26px}.hero h1{font-size:36px}}
</style>
</head>
<body>
<header><div><div class="brand">Foot<span>X</span></div><div class="sub">Dein Verein. Deine Entscheidungen.</div></div><span class="pill">SAISON 2026/27</span></header>
<main class="wrap" id="app"></main><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div>
<script>
const initialPlayers=[
{id:1,name:"M. Neuer",pos:"TW",age:38,rating:82,value:1800000,salary:90000},
{id:2,name:"A. Davies",pos:"LV",age:25,rating:84,value:52000000,salary:180000},
{id:3,name:"D. Upamecano",pos:"IV",age:27,rating:83,value:42000000,salary:160000},
{id:4,name:"K. Kim",pos:"IV",age:29,rating:82,value:35000000,salary:145000},
{id:5,name:"K. Laimer",pos:"RV",age:28,rating:81,value:28000000,salary:110000},
{id:6,name:"J. Kimmich",pos:"ZM",age:31,rating:88,value:65000000,salary:250000},
{id:7,name:"A. Pavlović",pos:"ZM",age:22,rating:80,value:32000000,salary:85000},
{id:8,name:"L. Sané",pos:"RF",age:30,rating:84,value:38000000,salary:210000},
{id:9,name:"J. Musiala",pos:"OM",age:23,rating:91,value:115000000,salary:280000},
{id:10,name:"S. Gnabry",pos:"LF",age:31,rating:81,value:24000000,salary:190000},
{id:11,name:"H. Kane",pos:"ST",age:33,rating:92,value:78000000,salary:400000}];
const market=[
{name:"N. Williams",pos:"LF",age:24,rating:86,value:62000000},
{name:"F. Wirtz",pos:"OM",age:23,rating:91,value:105000000},
{name:"J. Frimpong",pos:"RV",age:25,rating:85,value:48000000},
{name:"A. Onana",pos:"TW",age:30,rating:83,value:27000000},
{name:"E. Ferguson",pos:"ST",age:22,rating:79,value:18000000},
{name:"P. Foden",pos:"OM",age:26,rating:89,value:92000000},
{name:"R. Leão",pos:"LF",age:27,rating:88,value:85000000},
{name:"J. Tah",pos:"IV",age:30,rating:82,value:25000000}];
const clubs=["FC Bayern","Borussia Dortmund","Bayer Leverkusen","RB Leipzig","Eintracht Frankfurt","VfB Stuttgart","SC Freiburg","Werder Bremen","TSG Hoffenheim","VfL Wolfsburg","1. FSV Mainz 05","Borussia M'gladbach","FC Augsburg","Union Berlin","FC St. Pauli","1. FC Heidenheim","Hamburger SV","1. FC Köln"];
let state;try{state=JSON.parse(localStorage.getItem("footx-save"))}catch(e){}
if(!state)state={club:"FC Bayern",money:85000000,players:initialPlayers,week:1,season:1,played:[],log:["Willkommen bei FootX! Übernimm deinen Verein."],managed:["FC Bayern"]};
let tab="home",filterPos="Alle",search="",toastTimer;
const money=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
function save(){localStorage.setItem("footx-save",JSON.stringify(state))}
function notify(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",2200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function allMatches(){let out=[];for(let r=0;r<17;r++){let a=clubs[r],b=clubs[(r+1)%18];if(a===state.club||b===state.club)out.push({a,b,id:r});}return out}
function standings(){let t=clubs.map(n=>({name:n,pts:0,pl:0,w:0,d:0,l:0,gf:0,ga:0}));state.played.forEach(m=>{let a=t.find(x=>x.name===m.a),b=t.find(x=>x.name===m.b);if(!a||!b)return;a.pl++;b.pl++;a.gf+=m.ga;a.ga+=m.gb;b.gf+=m.gb;b.ga+=m.ga;if(m.ga>m.gb){a.pts+=3;a.w++;b.l++}else if(m.ga<m.gb){b.pts+=3;b.w++;a.l++}else{a.pts++;b.pts++;a.d++;b.d++}});return t.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga))}
function playerRows(list){return list.map(p=>'<div class="player"><div class="avatar">'+esc(p.pos)+'</div><div class="grow"><div class="name">'+esc(p.name)+'</div><div class="detail">'+p.age+' Jahre · '+esc(p.pos)+' · Gehalt '+money(p.salary||0)+'/W</div></div><div style="text-align:right"><div class="rating">'+p.rating+'</div><div class="price">'+money(p.value)+'</div></div></div>').join("")}
function home(){let avg=Math.round(state.players.reduce((s,p)=>s+p.rating,0)/Math.max(1,state.players.length));let next=allMatches()[0]||{a:state.club,b:"Borussia Dortmund"};return '<section class="hero"><div class="eyebrow">Karrieremodus · Saison '+state.season+'</div><h1>Willkommen,<br>'+esc(state.club)+'-Boss.</h1><p>Baue dein Team auf, scoute Talente und führe deinen Verein an die Spitze.</p><span class="pill">SPIELTAG '+state.week+'</span><div class="actionrow"><button onclick="playMatch()">▶ Spiel simulieren</button><button class="secondary" onclick="go(\'squad\')">Kader ansehen</button></div></section><div class="stats"><div class="stat"><small>Transferbudget</small><strong>'+money(state.money)+'</strong></div><div class="stat"><small>Kadergröße</small><strong>'+state.players.length+'</strong></div><div class="stat"><small>Kaderstärke</small><strong>'+avg+'</strong></div></div><div class="sectionhead"><h2>📅 Nächstes Spiel</h2><span class="muted">Spieltag '+state.week+'</span></div><div class="card"><div class="eyebrow">Bundesliga</div><div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0"><div style="text-align:center;flex:1"><div style="font-size:30px">🟢</div><b>'+esc(state.club)+'</b></div><div class="score">VS</div><div style="text-align:center;flex:1"><div style="font-size:30px">⚽</div><b>'+esc(next.a===state.club?next.b:next.a)+'</b></div></div><button style="width:100%" onclick="playMatch()">Spiel starten</button></div><div class="sectionhead"><h2>📰 Vereinsnachrichten</h2></div><div class="card">'+state.log.slice(-3).reverse().map(x=>'<p style="margin:4px 0 10px">• '+esc(x)+'</p>').join("")+'</div>'}
function squad(){return '<div class="sectionhead"><h2>👥 Mein Kader</h2><span class="pill">'+state.players.length+' Spieler</span></div><div class="stats"><div class="stat"><small>Torhüter</small><strong>'+state.players.filter(p=>p.pos==="TW").length+'</strong></div><div class="stat"><small>Abwehr</small><strong>'+state.players.filter(p=>["LV","RV","IV"].includes(p.pos)).length+'</strong></div><div class="stat"><small>Angriff</small><strong>'+state.players.filter(p=>["ST","LF","RF","OM"].includes(p.pos)).length+'</strong></div></div><div class="rows">'+playerRows(state.players)+'</div><p class="notice">Spielerwerte und Gehälter sind Beispieldaten für den Prototyp.</p>'}
function transfers(){let list=market.filter(p=>(filterPos==="Alle"||p.pos===filterPos)&&p.name.toLowerCase().includes(search.toLowerCase())&&!state.players.some(q=>q.name===p.name));return '<div class="sectionhead"><h2>🔎 Transfermarkt</h2><span class="pill">'+money(state.money)+'</span></div><div class="card"><label class="label">Spieler suchen</label><input class="field" placeholder="Name eingeben…" value="'+esc(search)+'" oninput="search=this.value;render()"><label class="label">Position</label><select class="field" onchange="filterPos=this.value;render()">'+["Alle","TW","LV","RV","IV","ZM","OM","LF","RF","ST"].map(p=>'<option '+(p===filterPos?'selected':'')+'>'+p+'</option>').join("")+'</select></div><div class="rows">'+(list.length?list.map(p=>'<div class="player"><div class="avatar">'+p.pos+'</div><div class="grow"><div class="name">'+p.name+'</div><div class="detail">'+p.age+' Jahre · Ablöse '+money(p.value)+'</div></div><div style="text-align:right"><div class="rating">'+p.rating+'</div><button style="margin-top:6px;padding:8px 10px" onclick="buy(\''+p.name.replace(/'/g,"\\'")+'\')">Kaufen</button></div></div>').join(""):'<div class="empty">Keine passenden Spieler gefunden.</div>')+'<p class="notice">Der Kauf zieht die Ablöse vom Budget ab. Beispielspieler, keine Live-Marktdaten.</p></div>'}
function table(){let rows=standings();return '<div class="sectionhead"><h2>🏆 Bundesliga</h2><span class="pill">Saison '+state.season+'</span></div><div class="card" style="overflow-x:auto"><table class="table"><thead><tr><th>#</th><th>Verein</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>TD</th><th>Pk</th></tr></thead><tbody>'+rows.map((t,i)=>'<tr><td>'+(i+1)+'</td><td style="text-align:left;white-space:nowrap">'+(t.name===state.club?'★ ':'')+esc(t.name)+'</td><td>'+t.pl+'</td><td>'+t.w+'</td><td>'+t.d+'</td><td>'+t.l+'</td><td>'+(t.gf-t.ga>0?'+':'')+(t.gf-t.ga)+'</td><td>'+t.pts+'</td></tr>').join("")+'</tbody></table></div><p class="notice">Die Tabelle aktualisiert sich mit simulierten Spielen. Aktuell gespielte Partien: '+state.played.length+'.</p>'}
function finances(){let wage=state.players.reduce((s,p)=>s+(p.salary||0),0);return '<div class="sectionhead"><h2>💶 Finanzen</h2></div><div class="stats"><div class="stat"><small>Transferbudget</small><strong>'+money(state.money)+'</strong></div><div class="stat"><small>Wochengehälter</small><strong>'+money(wage)+'</strong></div><div class="stat"><small>Kaderwert</small><strong>'+money(state.players.reduce((s,p)=>s+p.value,0))+'</strong></div></div><div class="card"><h3>Vereinsverwaltung</h3><label class="label">Aktiven Verein wählen</label><select class="field" onchange="switchClub(this.value)">'+state.managed.map(c=>'<option '+(c===state.club?'selected':'')+'>'+esc(c)+'</option>').join("")+'</select><label class="label">Weiteren Verein übernehmen</label><select class="field" id="newclub">'+clubs.filter(c=>!state.managed.includes(c)).map(c=>'<option>'+esc(c)+'</option>').join("")+'</select><button style="width:100%" onclick="addClub()">Verein hinzufügen</button><div class="actionrow"><button class="secondary" onclick="exportSave()">Spielstand exportieren</button><button class="secondary" onclick="resetSave()">Neu starten</button></div></div><p class="notice">Der Spielstand wird lokal in diesem Browser gespeichert. Exportiere ihn zur Sicherung oder zum Umzug auf ein anderes Gerät.</p>'}
function go(t){tab=t;render()}
function render(){document.getElementById("app").innerHTML=({home,squad,transfers,table,finances})[tab]();document.getElementById("nav").innerHTML=[["home","⌂","Start"],["squad","♟","Kader"],["transfers","⇄","Transfers"],["table","🏆","Tabelle"],["finances","€","Verein"]].map(([id,ico,label])=>'<button class="'+(tab===id?'active':'')+'" onclick="go(\''+id+'\')"><span class="ico">'+ico+'</span>'+label+'</button>').join("");}
function buy(name){let p=market.find(x=>x.name===name);if(!p)return;if(state.money<p.value){notify("Nicht genug Transferbudget!");return}if(state.players.some(x=>x.name===name)){notify("Spieler ist bereits im Kader.");return}state.money-=p.value;state.players.push({...p,id:Date.now(),salary:Math.round(p.value/450)});state.log.push(name+" verpflichtet für "+money(p.value)+".");save();render();notify("Transfer abgeschlossen!")}
function switchClub(c){state.club=c;state.log.push("Du leitest jetzt "+c+".");save();render();notify("Verein gewechselt")}
function addClub(){let el=document.getElementById("newclub");if(!el||!el.value){notify("Alle Vereine bereits übernommen.");return}if(!state.managed.includes(el.value))state.managed.push(el.value);state.club=el.value;state.money=45000000;state.players=initialPlayers.map(p=>({...p}));state.log.push("Neuen Verein übernommen: "+state.club+".");save();render();notify("Verein hinzugefügt")}
function playMatch(){let candidates=allMatches();let match=candidates[(state.week-1)%candidates.length]||{a:state.club,b:"Borussia Dortmund"};let home=match.a===state.club;let opponent=home?match.b:match.a;let strength=state.players.reduce((s,p)=>s+p.rating,0)/Math.max(1,state.players.length);let oppStrength=80+Math.random()*5;let g1=Math.max(0,Math.round(Math.random()*2+(strength-oppStrength)/5+(home?.4:0)));let g2=Math.max(0,Math.round(Math.random()*2+(oppStrength-strength)/5+(!home?.4:0)));let a=home?g1:g2,b=home?g2:g1;state.played.push({a:state.club,b:opponent,ga:a,gb:b});let msg=state.club+" "+a+":"+b+" "+opponent+" (Halbzeit "+Math.max(0,a-(Math.random()<.5?1:0))+":"+Math.max(0,b-(Math.random()<.5?1:0))+").";state.log.push(msg);state.money+=a>b?1500000:a===b?650000:250000;state.week++;if(state.week>34){state.week=1;state.season++;state.played=[];state.log.push("Eine neue Saison beginnt!");}save();render();notify("Abpfiff: "+a+":"+b+" gegen "+opponent)}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="footx-spielstand.json";a.click();URL.revokeObjectURL(url);notify("Export vorbereitet")}
function resetSave(){if(confirm("Wirklich einen neuen Spielstand beginnen?")){localStorage.removeItem("footx-save");location.reload()}}
render();
</script>
</body></html>
